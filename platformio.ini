[platformio]
default_envs = esp32-s3-supermini

[env:esp32-s3-supermini]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
; Use the generic S3 target with a 4 MB layout. PSRAM is not enabled.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.flash_mode = qio
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.12.6
monitor_speed = 115200
; Do not auto-select a motherboard UART while the ESP32 is asleep.
monitor_port = /dev/ttyACM*
; Native USB Serial/JTAG: clearing these individually on reconnect resets the
; chip and clears RTC memory. Keep both asserted to preserve timer wakeups.
monitor_dtr = 1
monitor_rts = 1
